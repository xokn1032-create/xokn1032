var PAL=[[23,69,122],[45,143,176],[232,201,155],[88,168,90],[42,106,74],[109,106,134],[58,44,120]];

function P(x,y,vx,vy,l,c,s){if(ps.length<260)ps.push({x:x,y:y,vx:vx,vy:vy,l:l,m:l,c:c,s:s})}
var px=0,py=0;for(var i0=0;i0<400&&(blk(px,py)||bio(Math.floor(px/TS),Math.floor(py/TS))<3);i0++){px+=TS;if(i0%25==24){px-=TS*25;py+=TS*3}}

function hero(sx,sy){var w=mv?Math.sin(T*(dash>0?26:15)):0,b=mv?Math.abs(w)*1.6|0:0,f=face,L=w>0?1:0;
g.fillStyle='rgba(0,0,0,.3)';g.beginPath();g.ellipse(sx,sy,6,2.5,0,0,7);g.fill();
